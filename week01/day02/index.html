<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Чат (стриминг + история)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f7f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 800px;
            max-width: 100%;
            height: 90vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 18px 24px;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header button {
            background: none;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 13px;
            cursor: pointer;
            color: #555;
            transition: background 0.2s;
        }

        .chat-header button:hover {
            background: #f0f0f0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.2s ease;
        }

        .message.user {
            align-self: flex-end;
            background: #0084ff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: #e9e9eb;
            color: #1e1e1e;
            border-bottom-left-radius: 4px;
        }

        .message .label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.7;
        }

        .message.user .label {
            color: #cce4ff;
        }

        .message.ai .label {
            color: #666;
        }

        .message .content {
            margin-top: 2px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: #e9e9eb;
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            animation: typing 1.4s infinite both;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0.4;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-input {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .chat-input textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            resize: none;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            min-height: 52px;
            max-height: 150px;
        }

        .chat-input textarea:focus {
            border-color: #0084ff;
        }

        .chat-input button {
            padding: 0 28px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .chat-input button:hover {
            background: #006edb;
        }

        .chat-input button:disabled {
            background: #a0c8f0;
            cursor: not-allowed;
        }

        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 8px 16px;
            border-radius: 12px;
            align-self: center;
            font-size: 14px;
        }

        .empty-state {
            color: #999;
            text-align: center;
            margin-top: 40px;
            font-size: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        .params-info {
            font-size: 12px;
            color: #888;
            padding: 6px 16px;
            border-top: 1px solid #eee;
            background: #fafafa;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>💬 DeepSeek Чат (стриминг + история)</span>
        <button onclick="clearHistory()">Очистить</button>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="empty-state">👋 Задайте свой первый вопрос!</div>
    </div>

    <div class="chat-input">
        <textarea id="userInput" rows="1" placeholder="Введите сообщение..."
                  onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
        <button id="sendBtn" onclick="sendMessage()">Отправить</button>
    </div>
    <div class="params-info">
        ⚙️ max_tokens=300 · stop="\n\n" · история сохраняется · стриминг
    </div>
</div>

<script>
    // ----------------------------------------------------------------------
    // 1. КЛЮЧ API (вставьте свой)
    // ----------------------------------------------------------------------
    const API_KEY = "sk-...";

    const API_URL = "https://api.deepseek.com/v1/chat/completions";

    // ----------------------------------------------------------------------
    // 2. Параметры
    // ----------------------------------------------------------------------
    const MAX_TOKENS = 300;
    const STOP_SEQUENCE = ["\n\n"];
    const SYSTEM_PROMPT =
        "Ты – полезный ассистент. Отвечай только в формате JSON. Отвечай кратко, максимум 200 слов. " +
        "В ответе должен быть валидный плоский JSON-объект. " +
        "Если тема не касается музыки, отвечай: Сорян, я не шарю. " +
        "Не добавляй пояснений, markdown-разметку (например, ```json) или лишний текст. " +
        "Структура JSON: { \"answer\": \"текст ответа\", ... }.";

    // ----------------------------------------------------------------------
    // 3. Хранилище истории
    // ----------------------------------------------------------------------
    let conversationHistory = [];  // [{ role, content }, ...]

    // ----------------------------------------------------------------------
    // 4. Вспомогательные функции
    // ----------------------------------------------------------------------
    function isValidAscii(str) {
        return /^[\x00-\x7F]*$/.test(str);
    }

    function getChatContainer() {
        return document.getElementById('chatMessages');
    }

    // Отрисовка всей истории
    function renderHistory() {
        const container = getChatContainer();
        container.innerHTML = '';
        if (conversationHistory.length === 0) {
            container.innerHTML = `<div class="empty-state">👋 Задайте свой первый вопрос!</div>`;
            return;
        }
        for (const msg of conversationHistory) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'ai'}`;
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = msg.role === 'user' ? 'Вы' : 'DeepSeek';
            msgDiv.appendChild(label);
            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.textContent = msg.content;
            msgDiv.appendChild(contentDiv);
            container.appendChild(msgDiv);
        }
        container.scrollTop = container.scrollHeight;
    }

    function clearHistory() {
        conversationHistory = [];
        renderHistory();
        document.getElementById('userInput').focus();
    }

    function showError(message) {
        const container = getChatContainer();
        const errDiv = document.createElement('div');
        errDiv.className = 'error-msg';
        errDiv.textContent = '❌ ' + message;
        container.appendChild(errDiv);
        container.scrollTop = container.scrollHeight;
        setTimeout(() => {
            if (errDiv.parentNode) errDiv.remove();
        }, 8000);
    }

    function showTyping() {
        const container = getChatContainer();
        removeTyping();
        const div = document.createElement('div');
        div.className = 'typing-indicator';
        div.id = 'typingIndicator';
        for (let i = 0; i < 3; i++) {
            const span = document.createElement('span');
            div.appendChild(span);
        }
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    // ----------------------------------------------------------------------
    // 5. Отправка сообщения (со стримингом и историей)
    // ----------------------------------------------------------------------
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const question = input.value.trim();

        if (!question) return;
        if (!API_KEY || !isValidAscii(API_KEY)) {
            showError('API-ключ не задан или содержит недопустимые символы.');
            return;
        }

        // Очистить поле и заблокировать кнопку
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;

        // Добавляем вопрос пользователя в историю и отображаем
        conversationHistory.push({role: 'user', content: question});
        renderHistory();

        // Показываем индикатор печати
        showTyping();

        // Переменная для накопления ответа
        let fullAnswer = '';
        let aiMessageElement = null;

        try {
            // Формируем массив сообщений: system + вся история
            const messages = [
                {role: 'system', content: SYSTEM_PROMPT},
                ...conversationHistory
            ];

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: messages,
                    max_tokens: MAX_TOKENS,
                    stop: STOP_SEQUENCE,
                    stream: true   // включён стриминг
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errText}`);
            }

            // Убираем индикатор печати
            removeTyping();

            // Читаем поток
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const {done, value} = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, {stream: true});
                const parts = buffer.split('\n\n');
                buffer = parts.pop();

                for (const part of parts) {
                    const lines = part.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const payload = line.slice(6);
                            if (payload === '[DONE]') continue;
                            try {
                                const json = JSON.parse(payload);
                                const delta = json.choices[0].delta;
                                if (delta.content) {
                                    fullAnswer += delta.content;
                                    // Если элемент ещё не создан, создаём его (временно без сохранения в историю)
                                    if (!aiMessageElement) {
                                        // Добавляем сообщение AI в DOM, но пока не в историю
                                        const container = getChatContainer();
                                        const msgDiv = document.createElement('div');
                                        msgDiv.className = 'message ai';
                                        const label = document.createElement('div');
                                        label.className = 'label';
                                        label.textContent = 'DeepSeek';
                                        msgDiv.appendChild(label);
                                        const contentDiv = document.createElement('div');
                                        contentDiv.className = 'content';
                                        contentDiv.textContent = fullAnswer;
                                        msgDiv.appendChild(contentDiv);
                                        container.appendChild(msgDiv);
                                        aiMessageElement = msgDiv;
                                    } else {
                                        // Обновляем содержимое существующего
                                        const contentDiv = aiMessageElement.querySelector('.content');
                                        contentDiv.textContent = fullAnswer;
                                    }
                                    getChatContainer().scrollTop = getChatContainer().scrollHeight;
                                }
                            } catch (e) {
                                // игнорируем
                            }
                        }
                    }
                }
            }

            // Если ответ не пустой, добавляем его в историю
            if (fullAnswer) {
                conversationHistory.push({role: 'assistant', content: fullAnswer});
                // Перерисовываем всю историю (чтобы синхронизировать состояние)
                // Но чтобы не терять уже отрисованное, можно просто обновить историю и перерисовать
                // Однако после завершения стрима у нас уже есть DOM-элемент с полным ответом.
                // Мы можем просто заменить его на "чистый" вариант из истории, но проще перерисовать всё.
                // Однако перерисовка сбросит анимацию, поэтому лучше оставить как есть, но обновить историю.
                // Мы уже добавили в историю, а DOM уже содержит ответ. Осталось только убедиться,
                // что при следующем рендере (при новом вопросе) всё будет синхронизировано.
                // Для этого после добавления ответа в историю мы можем вызвать renderHistory(),
                // но это пересоздаст все сообщения, что сбросит состояние анимации.
                // Поэтому мы не перерисовываем, а просто оставляем DOM как есть,
                // но при следующем вопросе renderHistory() перестроит всё заново.
                // Можно пометить, что последнее сообщение в истории уже отрисовано.
                // Однако проще: после завершения стрима мы добавляем ответ в историю,
                // и при следующем вызове renderHistory() он будет учтён.
                // Текущий DOM остаётся корректным, но если мы вызовем renderHistory() сейчас,
                // то он перерисует всё, включая только что добавленное сообщение.
                // Чтобы не было дублирования, можно не вызывать renderHistory() здесь,
                // а просто обновить историю, и при следующем вопросе она отобразится правильно.
                // Однако если пользователь нажмёт "Очистить", история очистится и DOM обновится.
                // Поэтому мы просто сохраняем в историю и ничего не перерисовываем.
                // Единственный нюанс: если в процессе стрима произошла ошибка, мы не добавим ответ.
                //
                // Итог: добавляем в историю, но не вызываем renderHistory(), чтобы не сбросить анимацию.
                // При следующем вопросе renderHistory() отобразит всё корректно.
            } else {
                // Пустой ответ — добавляем сообщение об ошибке
                if (!aiMessageElement) {
                    // создаём сообщение "пусто"
                    const container = getChatContainer();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message ai';
                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = 'DeepSeek';
                    msgDiv.appendChild(label);
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'content';
                    contentDiv.textContent = '⚠️ Пустой ответ от модели.';
                    msgDiv.appendChild(contentDiv);
                    container.appendChild(msgDiv);
                } else {
                    const contentDiv = aiMessageElement.querySelector('.content');
                    contentDiv.textContent = '⚠️ Пустой ответ от модели.';
                }
                // В историю не добавляем, чтобы не хранить пустоту
            }

        } catch (error) {
            removeTyping();
            showError('Ошибка: ' + error.message);
            // Можно удалить последнее сообщение пользователя из истории, чтобы не плодить "висячие" вопросы
            // Но лучше оставить, чтобы пользователь видел свой вопрос
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    // Авто-высота textarea
    document.getElementById('userInput').addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('userInput').focus();
    });
</script>

</body>
</html>
