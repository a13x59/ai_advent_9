<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Temperature Comparison</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    .container { max-width: 1200px; margin: 0 auto; }
    textarea { width: 100%; padding: 10px; font-size: 16px; }
    button { padding: 10px 30px; font-size: 16px; cursor: pointer; }
    .columns {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .col {
      flex: 1;
      min-width: 250px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .col h3 { margin-top: 0; }
    .col input[type="number"] { width: 80px; padding: 5px; font-size: 14px; }
    .output {
      border: 1px solid #eee;
      background: #fafafa;
      border-radius: 4px;
      padding: 10px;
      min-height: 150px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-top: 10px;
      font-size: 14px;
    }
    .error { color: #d32f2f; }
    .status { font-size: 14px; color: #555; margin-top: 5px; }
  </style>
</head>
<body>
<div class="container">
  <h1>Сравнение температур DeepSeek</h1>
  <div>
    <label for="prompt"><strong>Ваш запрос:</strong></label>
    <textarea id="prompt" rows="3" placeholder="Введите вопрос…"></textarea>
  </div>
  <button id="sendBtn">Отправить</button>

  <div class="columns">
    <div class="col">
      <h3>🌡️ Temperature 1</h3>
      <input type="number" id="temp0" value="0" step="0.1" min="0" max="2">
      <div id="output0" class="output">Ожидание запроса…</div>
      <div id="status0" class="status"></div>
    </div>
    <div class="col">
      <h3>🌡️ Temperature 2</h3>
      <input type="number" id="temp1" value="0.7" step="0.1" min="0" max="2">
      <div id="output1" class="output">Ожидание запроса…</div>
      <div id="status1" class="status"></div>
    </div>
    <div class="col">
      <h3>🌡️ Temperature 3</h3>
      <input type="number" id="temp2" value="1.2" step="0.1" min="0" max="2">
      <div id="output2" class="output">Ожидание запроса…</div>
      <div id="status2" class="status"></div>
    </div>
  </div>
</div>

<script>
  // ================== НАСТРОЙКА ==================
  // ВСТАВЬТЕ СВОЙ API-КЛЮЧ DEEPSEEK
  const API_KEY = 'sk-...';   // замените на реальный ключ

  // Модель (можно оставить deepseek-chat)
  const MODEL = 'deepseek-chat';

  // ================== КОД ==================
  const sendBtn = document.getElementById('sendBtn');
  const promptInput = document.getElementById('prompt');

  const tempInputs = [
    document.getElementById('temp0'),
    document.getElementById('temp1'),
    document.getElementById('temp2')
  ];
  const outputDivs = [
    document.getElementById('output0'),
    document.getElementById('output1'),
    document.getElementById('output2')
  ];
  const statusDivs = [
    document.getElementById('status0'),
    document.getElementById('status1'),
    document.getElementById('status2')
  ];

  // Функция потокового запроса к DeepSeek
  async function streamDeepSeek(prompt, temperature, outputEl, statusEl) {
    // Очищаем вывод и статус
    outputEl.textContent = '';
    statusEl.textContent = '⏳ Загрузка…';
    outputEl.classList.remove('error');

    try {
      const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: MODEL,
          messages: [{ role: 'user', content: prompt }],
          temperature: temperature,
          stream: true
        })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errText}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        // SSE разделяются двойным переводом строки
        const parts = buffer.split('\n\n');
        buffer = parts.pop(); // последний кусок может быть неполным

        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const payload = part.slice(6); // убираем "data: "
          if (payload === '[DONE]') continue;

          try {
            const json = JSON.parse(payload);
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              fullText += delta;
              outputEl.textContent = fullText;
            }
          } catch (e) {
            // игнорируем невалидный JSON
          }
        }
      }

      statusEl.textContent = '✅ Готово';
    } catch (error) {
      outputEl.textContent = `❌ Ошибка: ${error.message}`;
      outputEl.classList.add('error');
      statusEl.textContent = '❌ Ошибка';
    }
  }

  // Обработчик кнопки "Отправить"
  sendBtn.addEventListener('click', () => {
    const prompt = promptInput.value.trim();
    if (!prompt) {
      alert('Пожалуйста, введите запрос.');
      return;
    }

    // Считываем температуры из полей ввода
    const temperatures = tempInputs.map(inp => parseFloat(inp.value) || 0);

    // Запускаем три параллельных запроса (без await, чтобы выполнялись одновременно)
    temperatures.forEach((temp, idx) => {
      streamDeepSeek(prompt, temp, outputDivs[idx], statusDivs[idx]);
    });
  });

  // Для удобства: при нажатии Enter в текстовом поле тоже отправляем
  promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      sendBtn.click();
    }
  });
</script>
</body>
</html>
