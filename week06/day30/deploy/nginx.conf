# Приватный AI-сервис: обратный прокси.
# Публично доступен только фронт (/) и API агента (/agent*, ...) с X-Api-Key.
# Ollama (127.0.0.1:11434) наружу НЕ открывается.
#
# TLS добавляется через certbot (см. deploy/README.md); этот конфиг — HTTP.

# Ключ X-Api-Key длинный (48 символов), дефолтной корзины map_hash не хватает.
map_hash_bucket_size 256;

map $http_x_api_key $auth_ok {
    default 0;
    "__API_KEY__" 1;
}

server {
    listen 80;
    server_name _;

    root __PROJECT_ROOT__/agent;
    index index.html;
    # Чтобы ответ 401 отдавал JSON (а не text/html).
    default_type application/json;

    # Статика (фронт + config.js) — публично.
    location / {
        try_files $uri $uri/ =404;
    }

    # API агента — только с корректным заголовком X-Api-Key.
    location ~ ^/(agent|agents|memory|profiles|invariants|healthz|limits|docs|openapi\.json|redoc) {
        if ($auth_ok = 0) {
            return 401 '{"detail":"unauthorized: wrong or missing X-Api-Key"}';
        }
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Передаём РЕАЛЬНЫЙ IP (перезаписываем, чтобы клиент не подменил XFF)
        # — на нём агент считает rate limit per-IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}
